name: Deploy

on:
  push:
    branches: [main]
    # Documentation-only changes do not affect the deployed artifact, so skip
    # the deploy for them. Use workflow_dispatch to force a deploy if needed.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: production
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  # Override with repo variables if your paths differ from the convention.
  APP_DIR: ${{ vars.APP_DIR || 'apps/insure' }}
  CDK_DIR: ${{ vars.CDK_DIR || 'infra/cdk/insure' }}
  NODE_VERSION: "22"

jobs:
  # Skip the deploy when secrets aren't configured. This lets the platform
  # template repo itself (and any fresh fork before secrets are set) pass CI
  # without flagging a failure. Apps with secrets configured deploy normally.
  preflight:
    name: Preflight (skip if not configured)
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$ROLE_ARN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Deploy is configured. Proceeding."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_DEPLOY_ROLE_ARN secret is not set. Skipping deploy. This is normal for the template repo itself; apps using the template need to configure secrets per docs/SETUP.md."
          fi

  # The spec coverage gate must be green before anything ships (see
  # docs/TESTING.md). Runs the same suite as test.yml so a direct push to main
  # cannot deploy code the gate has never passed.
  gate:
    name: Spec gate before deploy
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build @platform/spec-test
        working-directory: packages/spec-test
        run: npm run build
      - name: Resolve Playwright version
        id: pw
        working-directory: ${{ env.APP_DIR }}
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers
        working-directory: ${{ env.APP_DIR }}
        run: npx playwright install --with-deps chromium
      - name: Spec gate (build + unit + e2e + coverage)
        working-directory: ${{ env.APP_DIR }}
        run: npm run test:spec

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    needs: [preflight, gate]
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install workspace dependencies
        run: npm ci

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: ${{ env.APP_DIR }}/.next/cache
          key: nextjs-deploy-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-deploy-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # The app's test specs import @platform/spec-test, whose dist is gitignored
      # and not produced by npm ci. next build type-checks those specs, so build
      # the package first or the production build fails to resolve it.
      - name: Build platform spec-test package
        run: npm run build --workspace packages/spec-test

      # CoverLens has no database or auth; nothing app-specific is needed at
      # build time (ALLOWED_ORIGINS and the checker key are read at runtime).
      - name: Build Next.js with OpenNext
        working-directory: ${{ env.APP_DIR }}
        run: npm run build:open-next

      - name: Install CDK dependencies
        working-directory: ${{ env.CDK_DIR }}
        run: npm ci

      # CDK reads these at synth time and bakes them into the Lambda env.
      - name: CDK deploy
        working-directory: ${{ env.CDK_DIR }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHECKER_MODEL: ${{ vars.CHECKER_MODEL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        run: npx cdk deploy --all --require-approval never --outputs-file cdk-outputs.json

      - name: Extract deployed URL
        id: cdk
        working-directory: ${{ env.CDK_DIR }}
        run: |
          URL=$(node -e "const o=require('./cdk-outputs.json'); for(const k of Object.keys(o)) for(const k2 of Object.keys(o[k])) if(k2.endsWith('DistributionUrl')) { console.log(o[k][k2]); break; }")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      # The platform smoke script assumes an auth app (/api/health, redirect to
      # /login). This app is a public single page, so check what it actually
      # exposes: the page renders, the checker route rejects a GET, and the
      # security headers are on.
      - name: Smoke test
        run: |
          URL="${{ steps.cdk.outputs.url }}"
          html=$(curl -sS --max-time 15 "$URL/")
          echo "$html" | grep -qi "coverlens" || { echo "::error::root page did not render CoverLens"; exit 1; }
          echo "GET / renders the app"
          api=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "$URL/api/check")
          echo "GET /api/check -> $api"
          case "$api" in 404|405) ;; *) echo "::error::/api/check unexpected status $api"; exit 1;; esac
          headers=$(curl -sSI --max-time 15 "$URL/")
          for h in "strict-transport-security" "x-content-type-options"; do
            echo "$headers" | grep -iq "^$h:" || { echo "::error::missing security header $h"; exit 1; }
          done
          echo "Security headers present."
          echo "Smoke test passed."
