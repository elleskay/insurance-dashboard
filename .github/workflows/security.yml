name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    # Runs on pull requests and the weekly schedule. Skipped on direct pushes to
    # main, since a merged PR was already scanned; avoids a redundant second run.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Blocking: anything the deployed Lambda actually ships must be clean of
      # high/critical advisories.
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high
      # Informational: dev/test tooling advisories are visible in the log but
      # do not fail the build; Dependabot PRs carry the fixes.
      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
